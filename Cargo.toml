[package]
name = "python-calamine-plus"
version = "0.2.0"
edition = "2021"

[lib]
name = "python_calamine_plus"
crate-type = ["cdylib"]

[dependencies]
# Vendored fork of calamine 0.36.1 with cell styles, comments and per-cell style ids.
calamine = { path = "vendor/calamine", features = ["chrono"] }
pyo3 = { version = "0.29.0", features = [
    "extension-module",
    "chrono",
    "generate-import-lib",
] }
chrono = { version = "0.4.42", features = ["serde"] }
pyo3-file = { git = "https://github.com/omerbenamram/pyo3-file.git", rev = "e88695f375ea3db95d96efc53707f4e8eb1def00" }

[build-dependencies]
pyo3-build-config = "0.29.0"
